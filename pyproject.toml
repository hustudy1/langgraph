[project]
name = "adaptive-rag"
version = "0.1.0"
description = "LangGraph-based Corrective/Adaptive RAG orchestration over the local `rag` retrieval library."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.40",
    "rag",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# `rag` is pulled from GitHub so this repo is self-contained: cloning it and
# running `uv sync` fetches the retrieval library automatically (uv.lock pins
# the exact commit). If you are co-developing the rag library locally, switch
# this line to an editable path instead, e.g.:
#   rag = { path = "../RAG", editable = true }
rag = { git = "https://github.com/hustudy1/RAG.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_rag"]
